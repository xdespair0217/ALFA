<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfa Romeo 專業多車型保養看板</title>
    <!-- 使用 Tailwind CSS 打造高質感暗色風格 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #161b22; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
        .active-row { background-color: #1f242c !important; border-left: 4px solid #da1a29 !important; }
        .active-card { border-color: #da1a29 !important; background-color: #21262d !important; transform: scale(1.02); }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col p-6 relative">

    <!-- 頂部標頭列 (支援按鈕過多時自動折成多行) -->
    <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center border-b border-gray-800 pb-4 mb-4 gap-4">
        <div class="flex items-center space-x-4 shrink-0">
            <!-- 仿 Alfa 熱血紅圓標 -->
            <div class="w-12 h-12 bg-red-700 rounded-full flex items-center justify-center font-black text-white text-xs tracking-wider shadow-md shadow-red-900/30">ALFA</div>
            <div>
                <!-- 車型切換下拉選單 -->
                <div class="flex items-center space-x-2">
                    <label for="car-model-select" class="text-xs text-gray-400 font-bold">目前展示車型：</label>
                    <select id="car-model-select" onchange="switchCarModel(this.value)" class="bg-[#161b22] text-white border border-gray-700 rounded px-2 py-1 text-sm font-bold focus:outline-none focus:border-red-600 cursor-pointer">
                        <!-- 選項將由 JavaScript 動態讀取 -->
                    </select>
                </div>
                <p class="text-[10px] text-gray-500 mt-1">數據來源：Google 雲端同步試算表（現場即時連線）</p>
            </div>
        </div>
        
        <!-- 套餐切換鈕區域 (自動折行，不限個數) -->
        <div id="package-tabs" class="flex flex-wrap gap-2 max-w-2xl justify-start lg:justify-center">
            <span class="text-sm text-gray-500">正在辨識保養套餐項目...</span>
        </div>

        <button onclick="fetchSheetData()" class="bg-[#161b22] hover:bg-gray-800 text-gray-300 hover:text-white text-xs px-4 py-2 rounded-lg transition-all border border-gray-700 flex items-center space-x-1.5 shrink-0">
            <span>🔄</span> <span>手動重新整理</span>
        </button>
    </header>

    <!-- 主顯示區 -->
    <main class="flex-1 flex space-x-6 overflow-hidden">
        
        <!-- 左側：保養套餐表格 -->
        <section class="w-7/12 flex flex-col bg-[#161b22] rounded-xl border border-gray-800 p-5 overflow-hidden shadow-2xl">
            <div class="flex justify-between items-center mb-3">
                <h2 id="current-package-title" class="text-lg font-bold text-red-500 flex items-center">
                    <span class="w-2 h-5 bg-red-600 inline-block mr-2 rounded-sm"></span>連線成功，正在排版中...
                </h2>
                <span class="text-[10px] bg-green-950 text-green-400 border border-green-900 px-2.5 py-0.5 rounded-full font-semibold">連線正常</span>
            </div>

            <!-- 表格主體 -->
            <div class="flex-1 overflow-y-auto custom-scrollbar">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-gray-700 text-gray-400 text-xs bg-[#0d1117]">
                            <th class="p-3 rounded-l-md">屬性</th>
                            <th class="p-3">料號</th>
                            <th class="p-3">項目名稱</th>
                            <th class="p-3 text-right">單價</th>
                            <th class="p-3 text-right">數量</th>
                            <th class="p-3 text-right">折讓</th>
                            <th class="p-3 text-right rounded-r-md">加總</th>
                        </tr>
                    </thead>
                    <tbody id="table-rows">
                        <!-- 資料由 JavaScript 動態生成 -->
                    </tbody>
                </table>
            </div>

            <!-- 底部總計金額 -->
            <div class="border-t border-gray-800 pt-4 mt-3 flex justify-between items-center">
                <span class="text-gray-400 text-sm font-medium">套餐應付總金額 (Estimated Total)</span>
                <span id="package-total" class="text-3xl font-black text-green-400 font-mono tracking-tight">$ 0</span>
            </div>
        </section>

        <!-- 右側：零件圖片展示牆 -->
        <section class="w-5/12 flex flex-col space-y-4 overflow-hidden">
            <div class="flex-1 bg-[#161b22] rounded-xl border border-gray-800 p-5 flex flex-col overflow-hidden shadow-2xl">
                <h3 class="text-sm font-semibold text-gray-400 mb-4 tracking-wider flex items-center">
                    <span class="mr-2">🔧</span>套餐内含零件圖解 (點擊表格高亮，點擊圖片彈出大圖)
                </h3>
                <!-- 圖片網格加入滾動條，自動向下延伸 -->
                <div id="image-grid" class="flex-1 grid grid-cols-2 gap-4 overflow-y-auto custom-scrollbar p-1 align-content-start">
                    <!-- 圖片卡片由 JavaScript 動態生成 -->
                </div>
            </div>

            <!-- 備註說明區 -->
            <div class="h-32 bg-[#161b22] rounded-xl border border-gray-800 p-4 flex flex-col justify-center">
                <h4 class="text-xs font-bold text-red-400 mb-1">💡 現場維護提示</h4>
                <p class="text-xs text-gray-400 leading-relaxed">
                    請技師依照 Alfa Romeo 原廠技術手冊標準程序進行更換。機油添加完畢後，請透過中控車載系統或 OBD 電腦進行油位準確校正及保養週期歸零。
                </p>
            </div>
        </section>

    </main>

    <!-- 【新功能】高質感點擊燈箱彈出視窗 (Lightbox) -->
    <div id="lightbox" onclick="closeLightbox()" class="hidden fixed inset-0 bg-black/90 z-50 flex flex-col justify-center items-center p-4 cursor-zoom-out transition-opacity duration-300 opacity-0">
        <!-- 關閉按鈕 -->
        <button class="absolute top-6 right-6 text-gray-400 hover:text-white text-4xl font-light focus:outline-none">&times;</button>
        <!-- 燈箱大圖容器 -->
        <div class="max-w-4xl max-h-[80vh] flex items-center justify-center bg-[#161b22] p-2 rounded-lg border border-gray-800 shadow-2xl" onclick="event.stopPropagation()">
            <img id="lightbox-img" src="" alt="零件大圖" class="max-w-full max-h-[75vh] object-contain rounded">
        </div>
        <!-- 燈箱零件名稱標題 -->
        <div class="mt-4 text-center" onclick="event.stopPropagation()">
            <p id="lightbox-part-id" class="text-xs text-gray-500 font-mono tracking-widest"></p>
            <h3 id="lightbox-title" class="text-lg font-bold text-white mt-1"></h3>
        </div>
    </div>

    <script>
        // ==========================================================
        // 【多車型雲端網址對照表】
        // ==========================================================
        const CAR_MODELS_SHEETS = {
            "Stelvio Sprint 2.0": "https://docs.google.com/spreadsheets/d/e/2PACX-1vS5HdgQrIifhCs12XLfy8GP_SF9znHAhkvr4yl_U7RFP712U3EOATCSm0_-h6aDtF2LA4kSwImjRcEp/pub?gid=548899643&single=true&output=csv",
            "Giulia 2.0 (設定範例)": "https://docs.google.com/spreadsheets/d/e/2PACX-1vS5HdgQrIifhCs12XLfy8GP_SF9znHAhkvr4yl_U7RFP712U3EOATCSm0_-h6aDtF2LA4kSwImjRcEp/pub?gid=548899643&single=true&output=csv",
            "Stelvio QV (設定範例)": "https://docs.google.com/spreadsheets/d/e/2PACX-1vS5HdgQrIifhCs12XLfy8GP_SF9znHAhkvr4yl_U7RFP712U3EOATCSm0_-h6aDtF2LA4kSwImjRcEp/pub?gid=548899643&single=true&output=csv"
        };

        let allParsedPackages = {}; 
        let currentPackageKey = "";
        let selectedModel = Object.keys(CAR_MODELS_SHEETS)[0];

        // 初始化車型下拉選單
        function initCarModelSelect() {
            const selectEl = document.getElementById('car-model-select');
            selectEl.innerHTML = Object.keys(CAR_MODELS_SHEETS).map(model => `
                <option value="${model}">${model}</option>
            `).join('');
        }

        // 切換不同車型時，重新抓取對應分頁的試算表
        function switchCarModel(modelName) {
            selectedModel = modelName;
            document.getElementById('package-tabs').innerHTML = '<span class="text-sm text-gray-500">正在切換車型並讀取雲端資料...</span>';
            fetchSheetData();
        }

        async function fetchSheetData() {
            const targetUrl = CAR_MODELS_SHEETS[selectedModel];
            try {
                const response = await fetch(targetUrl);
                const csvText = await response.text();
                parseExcelCSV(csvText);
            } catch (error) {
                console.error("抓取雲端資料失敗:", error);
                document.getElementById('current-package-title').innerText = "❌ 雲端資料加載失敗，請檢查網路連線";
            }
        }

        function parseExcelCSV(csvText) {
            const lines = csvText.split(/\r?\n/);
            const packages = {};
            let currentPackageName = ""; 

            lines.forEach((line) => {
                const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
                if (cols.length < 3) return;

                const foundPackageCell = cols.find(cell => cell && cell.includes("套餐"));
                
                if (foundPackageCell) {
                    currentPackageName = foundPackageCell;
                    packages[currentPackageName] = {
                        name: currentPackageName,
                        items: []
                    };
                    return;
                }

                const attr = cols[0] || "";
                const partId = cols[1] || "";
                const name = cols[2] || "";

                if (currentPackageName && partId && partId !== "料號" && attr !== "屬性") {
                    const price = cols[3] || "";
                    const qty = cols[4] || "";
                    const discount = cols[5] || "";
                    const subtotal = cols[6] || "";

                    const cleanSubtotal = parseFloat(subtotal.replace(/[^0-9.-]+/g, "")) || 0;

                    packages[currentPackageName].items.push({
                        attr, partId, name, price, qty, discount, subtotal, cleanSubtotal
                    });
                }
            });

            allParsedPackages = packages;

            const keys = Object.keys(allParsedPackages);
            if (keys.length > 0) {
                renderTabs(keys);
                switchPackage(keys[0]);
            } else {
                document.getElementById('current-package-title').innerText = "⚠️ 找不到任何套餐項目，請確認試算表格式是否發布正確";
                document.getElementById('table-rows').innerHTML = '';
                document.getElementById('image-grid').innerHTML = '';
                document.getElementById('package-total').innerText = '$ 0';
            }
        }

        function renderTabs(keys) {
            const tabsContainer = document.getElementById('package-tabs');
            tabsContainer.innerHTML = keys.map(key => `
                <button onclick="switchPackage('${key}')" id="tab-${key}" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-[#161b22] text-gray-400 hover:bg-gray-800 border border-gray-800 whitespace-nowrap">
                    ${key}
                </button>
            `).join('');
        }

        function switchPackage(key) {
            if (!allParsedPackages[key]) return;

            if (currentPackageKey) {
                const prevTab = document.getElementById(`tab-${currentPackageKey}`);
                if (prevTab) prevTab.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-[#161b22] text-gray-400 hover:bg-gray-800 border border-gray-800 whitespace-nowrap";
            }
            const activeTab = document.getElementById(`tab-${key}`);
            if (activeTab) activeTab.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-red-600 text-white shadow-lg border border-red-500 whitespace-nowrap";

            currentPackageKey = key;
            const pkg = allParsedPackages[key];

            document.getElementById('current-package-title').innerHTML = `<span class="w-2 h-5 bg-red-600 inline-block mr-2 rounded-sm"></span>${pkg.name}`;
            
            let tableHTML = '';
            let gridHTML = '';
            let calcTotal = 0;

            pkg.items.forEach(item => {
                calcTotal += item.cleanSubtotal;

                tableHTML += `
                    <tr id="row-${item.partId}" class="border-b border-gray-800 hover:bg-[#1f242c] transition-colors cursor-pointer" onclick="syncHighlight('${item.partId}')">
                        <td class="p-3 text-xs text-gray-400 font-medium">${item.attr}</td>
                        <td class="p-3 font-mono text-xs text-gray-300">${item.partId}</td>
                        <td class="p-3 text-white font-medium">${item.name}</td>
                        <td class="p-3 text-right font-mono">${item.price}</td>
                        <td class="p-3 text-right font-mono">${item.qty}</td>
                        <td class="p-3 text-right font-mono text-gray-400">${item.discount}</td>
                        <td class="p-3 text-right font-mono font-bold text-green-400">${item.subtotal}</td>
                    </tr>
                `;

                if (item.attr !== "工資" && item.partId) {
                    const imgUrl = `${item.partId}.jpg`;
                    const defaultImg = "https://images.unsplash.com/photo-1530046339160-ce3e530c7d2f?auto=format&fit=crop&w=300&q=80";
                    
                    gridHTML += `
                        <div id="card-${item.partId}" class="bg-[#1f242c] border border-gray-700 rounded-lg p-3 flex flex-col items-center justify-between transition-all cursor-pointer hover:border-gray-500 shadow-md" onclick="syncHighlight('${item.partId}')">
                            <!-- 
                              【核心改進一】：
                              圖片改用 object-contain 與 bg-[#0d1117] 深色底。
                              圖片不論多寬多高，皆能「等比例完美縮小並置中呈現」，絕不切邊、不拉伸。
                            -->
                            <div class="w-full h-28 bg-[#0d1117] rounded mb-2 flex items-center justify-center overflow-hidden relative group" onclick="openLightbox('${imgUrl}', '${item.partId}', '${item.name}', '${defaultImg}')">
                                <img src="${imgUrl}" alt="${item.name}" onerror="this.src='${defaultImg}'" class="object-contain w-full h-full p-1 opacity-85 group-hover:opacity-100 transition-opacity">
                                <!-- 滑鼠懸停時的放大提示微勳章 -->
                                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity rounded">
                                    <span class="text-xs text-white bg-red-600/90 px-2 py-1 rounded shadow">🔍 點擊看大圖</span>
                                </div>
                            </div>
                            <div class="text-center w-full mt-1">
                                <p class="text-[10px] text-gray-500 font-mono">${item.partId}</p>
                                <p class="text-xs text-white font-medium truncate">${item.name}</p>
                            </div>
                        </div>
                    `;
                }
            });

            document.getElementById('table-rows').innerHTML = tableHTML;
            document.getElementById('image-grid').innerHTML = gridHTML;
            document.getElementById('package-total').innerText = `$ ${calcTotal.toLocaleString()}`;
        }

        function syncHighlight(partId) {
            document.querySelectorAll('tr').forEach(el => el.classList.remove('active-row'));
            document.querySelectorAll('#image-grid > div').forEach(el => el.classList.remove('active-card'));

            const row = document.getElementById(`row-${partId}`);
            const card = document.getElementById(`card-${partId}`);
            if (row) row.classList.add('active-row');
            if (card) card.classList.add('active-card');
        }

        // ==========================================================
        // 【核心改進二】：高質感燈箱（Lightbox）控制邏輯
        // ==========================================================
        function openLightbox(imgSrc, partId, title, defaultImg) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxPartId = document.getElementById('lightbox-part-id');
            const lightboxTitle = document.getElementById('lightbox-title');

            // 預載圖片以防破圖
            lightboxImg.src = imgSrc;
            lightboxImg.onerror = function() {
                this.src = defaultImg;
            };

            lightboxPartId.innerText = partId;
            lightboxTitle.innerText = title;

            // 顯示動畫效果
            lightbox.classList.remove('hidden');
            setTimeout(() => {
                lightbox.classList.remove('opacity-0');
            }, 10);
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('opacity-0');
            // 等淡出動畫跑完後再隱藏
            setTimeout(() => {
                lightbox.classList.add('hidden');
            }, 300);
        }

        // 鍵盤 ESC 鍵安全關閉燈箱
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeLightbox();
            }
        });

        // 開網頁自動初始化
        initCarModelSelect();
        fetchSheetData();
    </script>
</body>
</html>
